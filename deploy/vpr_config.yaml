# ============================================================
# VPR 统一配置文件
# 所有用到 VPR 的服务共享此配置
# 修改后重启服务即可生效
# ============================================================

# VPR 方法: selavpr | megaloc | effovpr | anyloc
vpr_method: selavpr

# GPU 设备
device: "cuda:0"

# 是否使用无序匹配 (各方案独立设置)
# true: 忽略相机顺序，贪心二分匹配（适用于 AnyLoc/MegaLoc/EffoVPR）
# false: 利用相机空间排列约束，循环移位匹配 + 朝向估计（适用于 SelaVPR++）
order_invariant:
  selavpr: false
  megaloc: true
  effovpr: true
  anyloc: true

# VPR 相似度阈值 (各方案独立设置)
similarity_threshold:
  selavpr: 0.60
  megaloc: 0.60
  effovpr: 0.80
  anyloc: 0.70

# SelaVPR++ 专用配置 (仅 vpr_method=selavpr 时生效)
selavpr:
  backbone: dinov2-large
  aggregation: gem
  use_hashing: true
  use_rerank: true

# AnyLoc 专用配置 (仅 vpr_method=anyloc 时生效)
anyloc:
  dino_model: dinov2_vitb14
  agg_mode: vlad
  num_clusters: 32
  domain: indoor
  max_img_size: 630
